# docker-build.yml：打 TAG（vX.X.X）时构建并推送 ghcr.io 镜像（R10-09）
# - 触发：push v* 标签（如 v1.2.3）+ 手动触发（workflow_dispatch，供排查/重跑）
# - 标签（docker/metadata-action 生成，避免事件字段直接插值）：
#     TAG 触发 → vX.X.X（semver raw）+ 完整 sha
#     手动 main 分支 → latest + sha；手动其他分支 → 仅 sha（不覆盖 latest）
# - 产物：ghcr.io/<owner>/vpnmanagement:<标签>（镜像名必须小写（OCI 规范）；
#   Package 显示名可在 GitHub 包设置中改为「VPNManagement」）
# - 认证：GITHUB_TOKEN（packages: write），无需额外 PAT
name: Build & Push ghcr

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit (high gate)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vpnmanagement
          tags: |
            type=semver,pattern={{raw}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
